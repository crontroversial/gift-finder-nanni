<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weihnachten 2027 | Geschenkideen für Nanni</title>

    <!-- Girly Bubble Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="landing-page">

        <!-- Dekoration -->
        <div class="sparkles" aria-hidden="true">
            <span class="sparkle sparkle-1">✦</span>
            <span class="sparkle sparkle-2">✧</span>
            <span class="sparkle sparkle-3">✦</span>
            <span class="sparkle sparkle-4">✧</span>
            <span class="sparkle sparkle-5">✦</span>
            <span class="sparkle sparkle-6">✧</span>
        </div>

        <!-- Später ersetzen wir diese Bereiche durch unsere Bäume -->
        <div class="tree-placeholder tree-left" aria-hidden="true">
            <div class="tree-star">✦</div>
            <div class="tree-layer layer-1"></div>
            <div class="tree-layer layer-2"></div>
            <div class="tree-layer layer-3"></div>
            <div class="tree-layer layer-4"></div>
            <div class="tree-bow">୨୧</div>
        </div>

        <div class="tree-placeholder tree-right" aria-hidden="true">
            <div class="tree-star">✦</div>
            <div class="tree-layer layer-1"></div>
            <div class="tree-layer layer-2"></div>
            <div class="tree-layer layer-3"></div>
            <div class="tree-layer layer-4"></div>
            <div class="tree-bow">୨୧</div>
        </div>

        <!-- Hauptinhalt -->
        <section class="hero">

            <p class="year">Weihnachten 2027</p>

            <div class="mini-bow" aria-hidden="true">୨୧</div>

            <h1>
                Finde Dein perfektes
                <span>Geschenk für Nanni</span>
            </h1>

            <p class="subtitle">
                Weil gute Geschenke kein Zufall sein sollten.
            </p>

            <button class="gift-button" id="startButton">
                Geschenke finden
                <span class="button-star">✦</span>
            </button>

        </section>

        <footer>
            made with ♡ for Christmas 2027
        </footer>

    </main>

    <script src="script.js"></script>
</body>
</html>
